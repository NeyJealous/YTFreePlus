name: Build YTFreePlus IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct URL to your decrypted YouTube IPA
        required: true
        type: string
      display_name:
        description: App display name
        required: true
        default: YouTube
        type: string
      bundle_id:
        description: App bundle identifier
        required: true
        default: com.google.ios.youtube
        type: string

concurrency:
  group: ytfreeplus-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout YTFreePlus
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make ldid dpkg

      - name: Configure Theos
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks sdk-repo
          cd sdk-repo
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk "$THEOS/sdks/"

      - name: Build YTFreePlus tweak
        run: make clean package FINALPACKAGE=1

      - name: Locate YTFreePlus package
        run: |
          YTFP_DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$YTFP_DEB"
          echo "YTFP_DEB=$YTFP_DEB" >> "$GITHUB_ENV"

      - name: Download official free YTLite 5.2b4
        run: |
          curl -fL --retry 3             "https://github.com/dayanch96/YTLite/releases/download/v5.2b4/com.dvntm.ytlite_5.2b4_iphoneos-arm.deb"             -o ytlite-5.2b4.deb
          echo "56130dd4c7a1c9c80acc38c88d12002de3d099ca8de3698f87729331258ed9fa  ytlite-5.2b4.deb" | shasum -a 256 -c -

      - name: Download decrypted YouTube IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl -fL --retry 3 "$IPA_URL" -o youtube.ipa
          python3 - <<'PY'
          import zipfile
          p = "youtube.ipa"
          if not zipfile.is_zipfile(p):
              raise SystemExit("Input is not a valid ZIP/IPA")
          with zipfile.ZipFile(p) as z:
              apps = [n for n in z.namelist() if n.startswith("Payload/") and n.endswith(".app/")]
              if not apps:
                  raise SystemExit("IPA does not contain Payload/*.app")
          print("IPA structure validated")
          PY

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject free YTLite and YTFreePlus
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          cyan             -i youtube.ipa             -o YTFreePlus.ipa             -uwef ytlite-5.2b4.deb "$YTFP_DEB"             -n "$DISPLAY_NAME"             -b "$BUNDLE_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTFreePlus-IPA
          path: YTFreePlus.ipa
          if-no-files-found: error
