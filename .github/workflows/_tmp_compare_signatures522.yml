name: Temporary YTPlus signature comparison

on:
  push:
    paths:
      - ".github/workflows/_tmp_compare_signatures522.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Install dpkg
        run: brew install dpkg
      - name: Compare signatures only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report official-root cracked-root
          curl -fL --retry 3 "https://github.com/dayanch96/YTLite/releases/download/v5.2.2/com.dvntm.ytlite_5.2.2_iphoneos-arm.deb" -o official.deb
          curl -fL --retry 3 "https://github.com/Mark02-2012/MaxTube/releases/download/YTPlusVersions/com.dvntm.ytlite_5.2.2_iphoneos-arm.deb" -o cracked.deb
          dpkg-deb -x official.deb official-root
          dpkg-deb -x cracked.deb cracked-root
          cp "official-root/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib" official.dylib
          cp "cracked-root/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib" cracked.dylib

          python3 - <<'PY'
          from pathlib import Path
          o=Path("official.dylib").read_bytes()
          c=Path("cracked.dylib").read_bytes()
          dataoff=19314208
          n=min(dataoff,len(o),len(c))
          diff=sum(a!=b for a,b in zip(o[:n],c[:n]))
          Path("report/pre-signature-diff.txt").write_text(f"bytes compared before code signature: {n}\ndiffering bytes before code signature: {diff}\n")
          PY

          {
            echo "===== OFFICIAL SIGNATURE ====="
            codesign -dvvv official.dylib 2>&1 || true
            echo
            echo "===== MODIFIED SIGNATURE ====="
            codesign -dvvv cracked.dylib 2>&1 || true
          } > report/signature-summary.txt

          cp official.dylib official-nosig.dylib
          cp cracked.dylib cracked-nosig.dylib
          codesign --remove-signature official-nosig.dylib 2>/dev/null || true
          codesign --remove-signature cracked-nosig.dylib 2>/dev/null || true
          {
            shasum -a 256 official-nosig.dylib cracked-nosig.dylib
            stat -f '%N %z bytes' official-nosig.dylib cracked-nosig.dylib
            if cmp -s official-nosig.dylib cracked-nosig.dylib; then
              echo "UNSIGNED_BINARIES_IDENTICAL=YES"
            else
              echo "UNSIGNED_BINARIES_IDENTICAL=NO"
            fi
          } > report/unsigned-comparison.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ytplus522-signature-audit
          path: report/
          retention-days: 1
