name: Temporary YTPlus 5.2.2 detail audit

on:
  push:
    paths:
      - ".github/workflows/_tmp_audit_ytplus522_detail.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Install dpkg
        run: brew install dpkg
      - name: Analyze details
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report free-root cracked-root
          curl -fL --retry 3 "https://github.com/Mark02-2012/MaxTube/releases/download/YTPlusVersions/com.dvntm.ytlite_5.2.2_iphoneos-arm.deb" -o cracked.deb
          curl -fL --retry 3 "https://github.com/Mark02-2012/MaxTube/releases/download/YTPlusVersions/com.dvntm.ytlite_5.2b4_iphoneos-arm.deb" -o free.deb
          dpkg-deb -x cracked.deb cracked-root
          dpkg-deb -x free.deb free-root
          C="cracked-root/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib"
          F="free-root/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib"

          {
            echo "===== CRACKED FILTER ====="
            cat "cracked-root/Library/MobileSubstrate/DynamicLibraries/YTLite.plist"
            echo
            echo "===== FREE FILTER ====="
            cat "free-root/Library/MobileSubstrate/DynamicLibraries/YTLite.plist"
          } > report/injection-filter.txt

          {
            echo "===== CRACKED BUNDLE INFO ====="
            plutil -p "cracked-root/Library/Application Support/YTLite.bundle/Info.plist"
            echo
            echo "===== FREE BUNDLE INFO ====="
            plutil -p "free-root/Library/Application Support/YTLite.bundle/Info.plist"
          } > report/bundle-info.txt

          otool -l "$C" > report/cracked-load-commands.txt
          otool -l "$F" > report/free-load-commands.txt

          {
            echo "===== CRACKED BUILD/SYMTAB ====="
            grep -A12 -E 'cmd LC_(BUILD_VERSION|VERSION_MIN_IPHONEOS|SYMTAB|DYSYMTAB|CODE_SIGNATURE|UUID)' report/cracked-load-commands.txt
            echo
            echo "===== FREE BUILD/SYMTAB ====="
            grep -A12 -E 'cmd LC_(BUILD_VERSION|VERSION_MIN_IPHONEOS|SYMTAB|DYSYMTAB|CODE_SIGNATURE|UUID)' report/free-load-commands.txt
          } > report/build-symbol-metadata.txt || true

          {
            echo "cracked nm lines: $(nm -m "$C" 2>/dev/null | wc -l | tr -d ' ')"
            echo "free nm lines: $(nm -m "$F" 2>/dev/null | wc -l | tr -d ' ')"
            echo "cracked global undefined: $(nm -u "$C" 2>/dev/null | wc -l | tr -d ' ')"
            echo "free global undefined: $(nm -u "$F" 2>/dev/null | wc -l | tr -d ' ')"
          } > report/nm-counts.txt

          python3 - <<'PY'
          from pathlib import Path
          import plistlib, json
          base=Path("free-root/Library/Application Support/YTLite.bundle/en.lproj/Localizable.strings")
          new=Path("cracked-root/Library/Application Support/YTLite.bundle/en.lproj/Localizable.strings")
          def load(p):
              raw=p.read_bytes()
              try:
                  return plistlib.loads(raw)
              except Exception:
                  # Apple's .strings can be OpenStep text; plutil converts reliably on runner.
                  import subprocess, tempfile
                  out=subprocess.check_output(["plutil","-convert","json","-o","-",str(p)])
                  return json.loads(out)
          a=load(base); b=load(new)
          added=sorted(set(b)-set(a))
          removed=sorted(set(a)-set(b))
          changed=sorted(k for k in set(a)&set(b) if a[k]!=b[k])
          Path("report/localization-summary.txt").write_text(
              f"free keys: {len(a)}\ncracked keys: {len(b)}\nadded: {len(added)}\nremoved: {len(removed)}\nchanged values: {len(changed)}\n"
          )
          with Path("report/new-localization-keys.tsv").open("w") as f:
              for k in added:
                  v=str(b[k]).replace("\n","\\n")
                  f.write(f"{k}\t{v}\n")
          with Path("report/changed-localization-values.tsv").open("w") as f:
              for k in changed:
                  f.write(f"{k}\t{str(a[k]).replace(chr(10),' ')}\t{str(b[k]).replace(chr(10),' ')}\n")
          PY

          strings -a -n 5 "$C" | grep -E '5\.2(\.2|b4)|YTLite|YTPlus|YouTube Plus' | sort -u > report/version-name-strings.txt || true

      - name: Upload detail audit
        uses: actions/upload-artifact@v4
        with:
          name: ytplus522-detail-audit
          path: report/
          retention-days: 1
