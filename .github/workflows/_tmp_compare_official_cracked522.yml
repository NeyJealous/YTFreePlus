name: Temporary official vs cracked YTPlus 5.2.2 audit

on:
  push:
    paths:
      - ".github/workflows/_tmp_compare_official_cracked522.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Install dpkg
        run: brew install dpkg
      - name: Compare official and cracked 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report official-root cracked-root
          curl -fL --retry 3 "https://github.com/dayanch96/YTLite/releases/download/v5.2.2/com.dvntm.ytlite_5.2.2_iphoneos-arm.deb" -o official.deb
          curl -fL --retry 3 "https://github.com/Mark02-2012/MaxTube/releases/download/YTPlusVersions/com.dvntm.ytlite_5.2.2_iphoneos-arm.deb" -o cracked.deb
          dpkg-deb -x official.deb official-root
          dpkg-deb -x cracked.deb cracked-root
          O="official-root/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib"
          C="cracked-root/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib"

          {
            echo "===== PACKAGE HASHES / SIZES ====="
            shasum -a 256 official.deb cracked.deb
            stat -f '%N %z bytes' official.deb cracked.deb
            echo
            echo "===== DYLIB HASHES / SIZES ====="
            shasum -a 256 "$O" "$C"
            stat -f '%N %z bytes' "$O" "$C"
            echo
            echo "===== UUID / BUILD ====="
            for f in "$O" "$C"; do
              echo "--- $f"
              otool -l "$f" | grep -A6 -E 'cmd LC_(UUID|BUILD_VERSION|SYMTAB|CODE_SIGNATURE)' | head -n 80
            done
          } > report/summary.txt

          dpkg-deb -I official.deb > report/official-control.txt 2>&1
          dpkg-deb -I cracked.deb > report/cracked-control.txt 2>&1

          find official-root -type f -print | sed 's#^official-root/##' | sort > report/official-files.txt
          find cracked-root -type f -print | sed 's#^cracked-root/##' | sort > report/cracked-files.txt
          diff -u report/official-files.txt report/cracked-files.txt > report/filetree-diff.txt || true

          strings -a -n 6 "$O" | sort -u > official-strings.txt
          strings -a -n 6 "$C" | sort -u > cracked-strings.txt
          {
            echo "official unique strings: $(wc -l < official-strings.txt)"
            echo "cracked unique strings: $(wc -l < cracked-strings.txt)"
            echo "only official: $(comm -23 official-strings.txt cracked-strings.txt | wc -l | tr -d ' ')"
            echo "only cracked: $(comm -13 official-strings.txt cracked-strings.txt | wc -l | tr -d ' ')"
          } > report/string-comparison.txt

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          o=Path("official-root/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib").read_bytes()
          c=Path("cracked-root/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib").read_bytes()
          n=min(len(o),len(c))
          diffs=sum(a!=b for a,b in zip(o[:n],c[:n])) + abs(len(o)-len(c))
          # Count contiguous changed regions, but deliberately do not expose offsets.
          regions=0; in_region=False; maxrun=0; run=0
          for a,b in zip(o[:n],c[:n]):
              d=a!=b
              if d:
                  if not in_region: regions+=1; in_region=True; run=0
                  run+=1; maxrun=max(maxrun,run)
              else:
                  in_region=False; run=0
          if len(o)!=len(c): regions+=1
          Path("report/binary-diff-summary.txt").write_text(
              f"official dylib bytes: {len(o)}\ncracked dylib bytes: {len(c)}\n"
              f"differing bytes (position-wise plus length delta): {diffs}\n"
              f"contiguous changed regions: {regions}\n"
              f"largest contiguous changed region bytes: {maxrun}\n"
          )

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          a=Path("official-root"); b=Path("cracked-root")
          same=[]; changed=[]; only_a=[]; only_b=[]
          pa={x.relative_to(a) for x in a.rglob("*") if x.is_file()}
          pb={x.relative_to(b) for x in b.rglob("*") if x.is_file()}
          for p in sorted(pa & pb):
              if sha(a/p)==sha(b/p): same.append(str(p))
              else: changed.append(f"{p}\t{(a/p).stat().st_size}\t{(b/p).stat().st_size}")
          only_a=[str(x) for x in sorted(pa-pb)]
          only_b=[str(x) for x in sorted(pb-pa)]
          Path("report/package-file-comparison.txt").write_text(
              "IDENTICAL FILES\n"+"\n".join(same)+"\n\nCHANGED FILES (official_size cracked_size)\n"+"\n".join(changed)+
              "\n\nONLY OFFICIAL\n"+"\n".join(only_a)+"\n\nONLY CRACKED\n"+"\n".join(only_b)+"\n"
          )
          PY
      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: official-vs-cracked-522-audit
          path: report/
          retention-days: 1
